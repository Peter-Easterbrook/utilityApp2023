version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Toronto"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "npm"

    commit-message:
      prefix: "deps"
      include: "scope"

    versioning-strategy: "increase"

    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
